[package]
name = "bitcoin-ecc-generator"
version = "0.1.0"
edition = "2021"

[dependencies]
cuda-runtime-sys = { version = "0.3.0-alpha.1", optional = true }
secp256k1 = "0.28"
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
rayon = "1.7"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
criterion = "0.5"
cfg-if = "1.0"
bincode = "1.3"

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1.4.7"
cfg-if = "1.0"

# CUDA support (optional, requires NVIDIA GPU and CUDA toolkit)
[features]
default = []
cuda = ["dep:cuda-runtime-sys"]

[[bench]]
name = "pollard_kangaroo"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
inherits = "release"
