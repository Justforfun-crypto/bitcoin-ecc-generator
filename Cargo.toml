[package]
name = "bitcoin-ecc-generator"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
sled = "0.34"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
secp256k1 = { version = "0.27", features = ["rand", "recovery"] }
clap = { version = "4.0", features = ["derive"] }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }

[features]
cuda = []
